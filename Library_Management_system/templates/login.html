{% extends "base.html" %}

{% block title %}Login — IIIT Surat Library{% endblock %}

{% block content %}
<div class="login-container glass-panel" style="max-width: 420px; width: 100%; padding: 40px;">
    <div style="text-align: center; margin-bottom: 30px;">
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="IIIT Surat" style="width: 72px; height: auto; margin-bottom: 8px;">
        <h2 class="logo-text" style="font-size: 26px; margin-top: 12px;">IIIT Surat Library Login</h2>
        <p style="color: var(--text-muted); font-size: 14px; margin-top: 8px;">Enter your credentials to continue</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required
                autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn" style="width: 100%; margin-top: 20px; font-size: 16px;">Log In <i
                class="fa-solid fa-arrow-right" style="margin-left: 8px;"></i></button>
    </form>

    <div
        style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border-color); text-align: center; font-size: 14px; color: var(--text-muted);">
        <p>New student? <a href="{{ url_for('register') }}"
                style="color: var(--accent-blue); text-decoration: none; font-weight: 600;">Register here</a></p>
    </div>
</div>
{% endblock %}
