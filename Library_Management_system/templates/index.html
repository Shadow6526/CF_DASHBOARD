{% extends "base.html" %}
{% block title %}Welcome — IIIT Surat Library{% endblock %}
{% block content %}
<div class="glass-panel" style="max-width: 600px; width: 100%; padding: 60px 40px; text-align: center;">
    <img src="{{ url_for('static', filename='logo.jpg') }}" alt="IIIT Surat" style="width: 90px; height: auto; margin-bottom: 20px;">
    <h1 style="font-size: 36px; margin: 0 0 16px 0; color: var(--text-primary); font-weight: 800;">
        IIIT Surat Library</h1>
    <p style="color: var(--text-secondary); font-size: 17px; margin-bottom: 40px; line-height: 1.6;">
        A modern library management system for IIIT Surat. Manage books, track issues & fines, and monitor activity
        effortlessly.
    </p>

    <div style="display: flex; gap: 16px; justify-content: center;">
        <a href="{{ url_for('login') }}" class="btn" style="padding: 12px 32px; font-size: 16px;">
            Go to Login <i class="fa-solid fa-arrow-right" style="margin-left: 8px;"></i>
        </a>
    </div>
</div>
{% endblock %}
