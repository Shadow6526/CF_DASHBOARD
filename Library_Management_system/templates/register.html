{% extends "base.html" %}

{% block title %}Register - Library Management System{% endblock %}

{% block content %}
<div class="login-container glass-panel" style="max-width: 420px; width: 100%; padding: 40px;">
    <div style="text-align: center; margin-bottom: 30px;">
        <i class="fa-solid fa-user-plus logo-icon" style="font-size: 48px;"></i>
        <h2 class="logo-text" style="font-size: 28px; margin-top: 16px;">Student Registration</h2>
        <p style="color: var(--text-muted); font-size: 14px; margin-top: 8px;">Create your account — admin will approve
            it</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username"
                required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Min 4 characters"
                required minlength="4">
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                placeholder="Re-enter password" required minlength="4">
        </div>

        <button type="submit" class="btn" style="width: 100%; margin-top: 20px; font-size: 16px;">
            <i class="fa-solid fa-paper-plane" style="margin-right: 8px;"></i> Register
        </button>
    </form>

    <div
        style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border-color); text-align: center; font-size: 14px; color: var(--text-muted);">
        <p>Already have an account? <a href="{{ url_for('login') }}"
                style="color: var(--accent-blue); text-decoration: none; font-weight: 600;">Login here</a></p>
    </div>
</div>
{% endblock %}
